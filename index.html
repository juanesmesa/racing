<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Race Control</title>
    <link
      rel="icon"
      href="https://cdn-icons-png.flaticon.com/128/2822/2822628.png"
      type="image/png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.cdnfonts.com/css/digital-7-mono"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #070a0f;
        --card-bg: rgba(15, 23, 34, 0.85);
        --header-bg: rgba(15, 23, 34, 0.9);
        --input-bg: rgba(0, 0, 0, 0.5);
        --text: #e7eef7;
        --border: #1c2a3a;
        --border2: #24374d;
        --accent: #1f6feb;
        --danger: #b42318;
        --font-main: "Rubik", sans-serif;
        --header-h: 90px;
        --grid-layout: 60px 250px 1fr 1fr 150px;
        --live-timer-color: #00ff00;
      }

/* --- MODO DÍA: LIMPIEZA INTEGRAL Y CONTRASTE ALTO --- */
[data-theme="light"] {
  /* 1. Variables Globales */
  --bg: #f1f5f9 !important;        /* Fondo general gris perla */
  --card-bg: #ffffff !important;   /* Fondo de tarjetas blanco puro */
  --header-bg: #ffffff !important; /* Encabezado blanco */
  --text: #0f172a !important;      /* Texto azul muy oscuro */
  --input-bg: #ffffff !important;  /* Fondo de inputs blanco */
  --border: #cbd5e1 !important;    /* Bordes visibles */
  --accent: #1e293b !important;    /* Azul marino para botones */
  --live-timer-color: #0f172a !important;
}

/* 2. Forzar Fondo y Texto en TODA la página */
[data-theme="light"], 
[data-theme="light"] body,
[data-theme="light"] header,
[data-theme="light"] aside,
[data-theme="light"] main {
  background-color: var(--bg) !important;
  color: var(--text) !important;
}

/* 3. Solución para las CAJAS DE TEXTO (Inputs) */
[data-theme="light"] input, 
[data-theme="light"] select,
[data-theme="light"] .search-wrapper input {
  background-color: #ffffff !important;
  color: #0f172a !important;
  border: 1px solid #94a3b8 !important; /* Borde más fuerte para que se vea */
}
[data-theme="light"] input::placeholder {
  color: #64748b !important;
}

/* 4. Solución para el PODIO 1 (Encerrarlo para que no vuele) */
[data-theme="light"] .podiumCard {
  background-color: #ffffff !important;
  border: 2px solid #cbd5e1 !important; /* Borde que lo encierra */
  box-shadow: 0 4px 6px rgba(0,0,0,0.05) !important;
}
[data-theme="light"] .podiumCard:nth-child(1) {
  /* Fondo Ámbar profundo con texto negro para máximo contraste */
    background: #f59e0b !important; 
    color: #000000 !important;
    box-shadow: 0 2px 4px rgba(217, 119, 6, 0.3);
}

/* 5. Solución para las FILAS DE LA TABLA */
[data-theme="light"] .lbRow {
  background-color: #ffffff !important;
  color: #0f172a !important;
  border: 1px solid #e2e8f0 !important;
}
[data-theme="light"] .lbHeader {
  background-color: #f8fafc !important;
  color: #0f172a !important;
  border-bottom: 2px solid #0f172a !important;
}

/* 6. El nombre del piloto en el cronómetro */
[data-theme="light"] #nombre-piloto {
  color: #d97706 !important; /* Ámbar en lugar de amarillo */
    text-shadow: none !important;
    font-weight: 900 !important;
}
      .admin-hidden {
        display: none !important;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--text);
        font-family: var(--font-main);
        background: var(
          --bg
        ); /* Ahora solo usa el color sólido de tus variables */
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      header {
        height: var(--header-h);
        padding: 0 30px;
        background: var(--header-bg);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(10px);
        z-index: 100;
        flex-shrink: 0;
      }

      header h1 {
        margin: 0;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text);
        text-shadow: 0 0 10px rgba(31, 111, 235, 0.8);
        font-family: inherit;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: nowrap;
        white-space: nowrap;
      }

      .main-layout {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 25px;
        padding: 20px;
        flex: 1;
        min-height: 0;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 0;
      }
      .content-area {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 0;
        overflow: hidden;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(10px);
        overflow: hidden;
      }
      label {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--accent);
        letter-spacing: 1.5px;
        margin-bottom: 5px;
        display: block;
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        background: var(--input-bg);
        border: 1px solid var(--border2);
        color: var(--text);
        font-family: inherit;
        font-size: 16px;
        border-radius: 8px;
        outline: none;
      }

      .search-wrapper {
        position: relative;
        width: 100%;
      }
      .autocomplete-list {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--card-bg);
        border: 1px solid var(--border2);
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        border-radius: 0 0 8px 8px;
        display: none;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        margin-top: -15px;
      }
      .autocomplete-item {
        padding: 10px 15px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }
      .autocomplete-item:hover {
        background: var(--accent);
        color: white;
      }

      button {
        padding: 12px 18px;
        cursor: pointer;
        border-radius: 8px;
        font-weight: bold;
        font-family: inherit;
        text-transform: uppercase;
        border: none;
        transition: 0.2s;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        width: 100%;
        margin-bottom: 5px;
      }
      button.ghost {
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--border2);
      }
      button.danger {
        background: var(--danger);
        color: #fff;
      }
      button.btn-details {
        padding: 6px 12px;
        font-size: 10px;
        background: var(--accent);
        color: #fff;
      }

      .podium-container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px;
        flex-shrink: 0;
      }
      .podiumCard {
        position: relative;
        border-radius: 24px;
        padding: 4px;
        background: var(--card-color);
        min-height: 180px;
        display: flex;
      }
      /* ORION: podio escalonado con espacio real para su contenido. */
      @media (min-width: 901px) {
        .podium-container { align-items: end; }
        .podiumCard { min-height: 0; }
        .podiumCard:nth-child(1) {
          grid-column: 2;
          grid-row: 1;
          height: 320px;
          box-shadow: 0 0 16px rgba(255, 193, 7, 0.20);
        }
        .podiumCard:nth-child(2) {
          grid-column: 1;
          grid-row: 1;
          height: 280px;
        }
        .podiumCard:nth-child(3) {
          grid-column: 3;
          grid-row: 1;
          height: 260px;
        }
      }
      .podium-inner {
        width: 100%;
        height: 100%;
        background: var(--card-bg);
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .puesto-badge {
        background: var(--card-color);
        color: #000;
        padding: 10px 20px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
      }

      /* ORION: podio premium - solo presentacion. */
      .podiumCard { overflow: hidden; isolation: isolate; }
      .podiumCard:nth-child(1) { --podium-glow: rgba(255,195,18,.19); }
      .podiumCard:nth-child(2) { --podium-glow: rgba(200,215,235,.12); }
      .podiumCard:nth-child(3) { --podium-glow: rgba(212,124,54,.13); }
      .podium-inner {
        position: relative;
        isolation: isolate;
        align-items: center;
        gap: 6px;
        padding: 16px 20px 14px;
        background: radial-gradient(ellipse at 50% 46%, var(--podium-glow), transparent 68%), var(--card-bg);
      }
      .podium-inner::before, .podium-inner::after {
        content: "";
        position: absolute;
        z-index: -1;
        top: 32%;
        width: 110px;
        height: 105px;
        opacity: .12;
        background: repeating-conic-gradient(#b6c4d7 0 25%, transparent 0 50%) 0 0 / 26px 26px;
        pointer-events: none;
        transform: skewY(-15deg) rotate(-10deg);
        mask-image: linear-gradient(to bottom, transparent, black 30%, transparent);
      }
      .podium-inner::before { left: -14px; }
      .podium-inner::after { right: -14px; transform: scaleX(-1) skewY(-15deg) rotate(-10deg); }
      .puesto-badge {
        position: relative;
        z-index: 1;
        width: 100%;
        justify-content: center;
        flex-shrink: 0;
        padding: 8px 12px;
        font-size: 13px;
      }
      .podium-stage {
        position: relative;
        z-index: 1;
        flex: 1;
        width: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      .podium-emblem {
        width: min(112px, 30%);
        height: 96px;
        flex-shrink: 1;
        filter: drop-shadow(0 5px 13px var(--podium-glow));
      }
      .podium-emblem svg { display: block; width: 100%; height: 100%; }
      .podiumCard:nth-child(1) .podium-emblem { width: min(150px, 40%); height: 120px; }
      .podium-stage .pilot-info { width: 100%; min-width: 0; text-align: center; }
      .podium-stage .pilot-name-big { font-size: clamp(18px, 1.6vw, 25px); margin: 1px 0 9px; }
      .podium-stage .time-pill {
        display: inline-flex;
        justify-content: center;
        max-width: 100%;
        padding: 8px 18px;
        border: 1px solid color-mix(in srgb, var(--card-color) 55%, transparent);
        box-shadow: 0 0 16px var(--podium-glow);
      }
      .podium-stage .time-pill strong { font-size: clamp(18px, 1.6vw, 25px); font-variant-numeric: tabular-nums; }
      .podium-footer {
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        padding: 5px 13px;
        border-radius: 999px;
        color: var(--card-color);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-align: center;
      }
      .podiumCard:nth-child(1) .podium-footer { background: var(--card-color); color: #161a20; }
      /* Evita que el texto del tercer puesto se superponga al borde del tiempo. */
      .podiumCard:nth-child(3) .podium-emblem { height: 78px; }
      .podiumCard:nth-child(3) .podium-footer { margin-top: 10px; line-height: 1.4; }

      [data-theme="light"] .podium-inner { background: radial-gradient(ellipse at 50% 46%, var(--podium-glow), transparent 68%), #fff; }
      @media (max-width: 900px) {
        .podiumCard { min-height: 235px; }
        .podium-inner { padding: 15px; }
        .podium-emblem, .podiumCard:nth-child(1) .podium-emblem { width: 100px; height: 86px; }
      }
      .puesto-numero-bg {
        font-size: 45px;
        font-weight: 900;
        line-height: 1;
        margin-top: -5px;
        color: var(--card-color);
        opacity: 0.8;
      }
      .pilot-name-big {
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .time-pill {
        background: var(--input-bg);
        border: 1px solid var(--border);
        padding: 8px 15px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .time-pill strong {
        font-size: 18px;
        color: var(--card-color);
        font-family: inherit;
      }

      .table-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .lbHeader {
        display: grid;
        grid-template-columns: var(--grid-layout);
        padding: 18px 25px;
        color: var(--accent);
        font-weight: 900;
        font-size: 14px;
        border-bottom: 2px solid var(--accent);
        background: var(--header-bg);
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .table-scroll-area {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }
      .lbRow {
        display: grid;
        grid-template-columns: var(--grid-layout);
        align-items: center;
        padding: 16px 25px;
        margin-top: 8px;
        border-radius: 12px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        color: var(--text);
      }
      .cell.center {
        text-align: center;
      }
      .cell.right {
        text-align: right;
      }

      #liveTime {
        font-size: 80px;
        font-weight: 900;
        color: var(--live-timer-color);
        font-family: "Digital-7 Mono", sans-serif;
        text-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        line-height: 1;
        transition: color 0.3s;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: var(--card-bg);
        border: 1px solid var(--border2);
        border-radius: 24px;
        /* CAMBIO CLAVE: Ancho fluido con un máximo */
        width: 95%;
        max-width: 600px;
        padding: 25px;
        color: var(
          --text
        ); /* Evita que sea más alto que la pantalla del móvil */
        max-height: 90vh;
        display: flex;
        flex-direction: column;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }
      .modal-list {
        overflow-y: auto;
        flex: 1;
        max-height: 400px;
      }
      .modal-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        margin-bottom: 10px;
        border-radius: 12px;
        background: var(--input-bg);
        border: 1px solid var(--border);
      }
      .history-mini {
        flex: 1;
        margin-top: 10px;
        border-top: 1px solid var(--border);
        padding-top: 15px;
        overflow-y: auto;


        max-height: 300px; /* Altura máxima antes de mostrar scroll */
        overflow-y: auto;  /* Habilita el scroll vertical */
        padding-right: 5px; /* Espacio para la barrita de scroll */
      }

      /* Opcional: Dale estilo a la barrita de scroll para que se vea racing */
      .history-mini::-webkit-scrollbar {
        width: 4px;
      }
      .history-mini::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-radius: 10px;
      }


      .hist-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }

      @media (max-width: 900px) {
        header h1 {
          font-size: 28px !important; /* Reducimos de 40px a 28px */
          white-space: normal !important; /* Permite que se divida en dos líneas si es necesario */
          text-align: center; /* Si se divide, que quede centrado */
          line-height: 1.2; /* Un poco de aire entre líneas */
        }

        /* 1. Liberar la altura total de la página */
        body,
        html {
          overflow-y: auto !important;
          height: auto !important;
        }

        /* 2. Layout fluido */
        .main-layout {
          grid-template-columns: 1fr;
          padding: 10px;
          height: auto !important;
        }

        header {
          height: auto;
          padding: 15px;
          flex-direction: column;
          gap: 15px;
        }
        .actions {
          width: 100%;
          justify-content: center;
          flex-wrap: wrap;
        }

        /* 3. Podio Vertical: El 3er lugar aparecerá debajo */
        .podium-container {
          grid-template-columns: 1fr;
          gap: 15px;
        }

        /* 4. SOLUCIÓN PARA SAMSUNG: Quitar el candado de altura a la tabla */
        .content-area,
        .table-card,
        .table-scroll-area {
          height: auto !important;
          max-height: none !important;
          overflow: visible !important;
          display: block !important;
        }

        /* 5. Ajuste de columnas para pantallas estrechas */
        .lbHeader,
        .lbRow {
          grid-template-columns: 35px 1fr 85px 70px !important;
          padding: 10px;
          font-size: 11px;
        }
        .cell:nth-child(4) {
          display: none;
        } /* Ocultamos 'Intentos' para ganar espacio */

        #liveTime {
          font-size: 50px !important;
        }

        /* 6. Modal elástico */
        .modal-content {
          padding: 15px;
          width: 92%;
          border-radius: 18px;
          max-height: 85vh;
        }
        .modal-header h2 {
          font-size: 1.4rem;
        }
        .modal-item {
          padding: 12px 15px;
          font-size: 13px;
        }
      }

      #notification-banner {
        position: fixed;
        top: -300px; /* Empieza arriba, fuera de la pantalla */
        left: 50%;
        transform: translateX(-50%); /* Centrado exacto horizontalmente */
        width: 90%;
        max-width: 800px;
        background: rgba(10, 15, 20, 0.95);
        color: white;
        border-bottom: 10px solid #ff0000; /* Borde inferior grueso rojo racing */
        padding: 40px;
        transition: top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Efecto de caída con rebote */
        z-index: 10000;
        text-align: center;
        border-radius: 0 0 30px 30px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
      }

      #notification-banner.mostrar {
        top: 0; /* Baja hasta pegarse al techo de la pantalla */
      }

      #notif-piloto {
        color: #ffcc00;
        font-weight: 900;
        display: block;
        font-size: 2rem; /* Nombre muy grande */
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 10px;
      }

      #notif-info {
        font-size: 1.2rem;
        color: #aaa;
        letter-spacing: 5px;
        text-transform: uppercase;
      }

      #notif-tiempo {
        font-size: 5rem; /* El tiempo es el protagonista */
        font-family: "Digital-7 Mono", monospace;
        color: #fff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        margin: 15px 0;
      }

      #notif-puesto {
        font-size: 1.5rem;
        color: #00ff00;
        font-weight: bold;
        text-transform: uppercase;
      }

      #notif-piloto {
        color: #ffcc00;
        font-weight: bold;
        display: block;
        font-size: 1.1rem;
      }
      #notif-tiempo {
        font-size: 1.8rem;
        font-family: monospace;
        color: #fff;
      }

      /* ANIMACIÓN DE RESALTADO */
      /* --- ANIMACIÓN MODO NOCHE (Amarillo o Verde) --- */
      @keyframes row-pulse-dark {
        0% {
          background-color: #ffcc00 !important;
          color: #000 !important;
          box-shadow: 0 0 20px #ffcc00;
        }
        50% {
          background-color: #eafa09 !important;
          color: #000 !important;
          box-shadow: 0 0 40px #acc713;
        }
        100% {
          background-color: #b10586 !important;
          color: #000 !important;
          box-shadow: 0 0 20px #a3049b;
        }
      }

      /* --- ANIMACIÓN MODO DÍA (Azul Pro) --- */
      @keyframes row-pulse-light {
        0% { background-color: #f59e0b !important; color: #fff !important; }
        50% { background-color: #ffffff !important; color: #f59e0b !important; }
        100% { background-color: #f59e0b !important; color: #fff !important; }
      }

      /* Clase base del resaltado */
      .row-highlighted {
        position: relative !important;
        z-index: 9999 !important;
        border: 3px solid #fff !important;
        font-weight: 900 !important;
        /* Por defecto usa la de noche */
        animation: row-pulse-dark 0.5s ease-in-out 6 !important;
      }

      /* --- CAMBIO AUTOMÁTICO PARA MODO DÍA --- */
      [data-theme="light"] .row-highlighted {
        animation: row-pulse-light 0.4s ease-in-out 6 !important;
        border: 2px solid #d97706 !important;
      }

      /* Borde del banner dinámico */
      #notification-banner {
        border-bottom: 10px solid var(--accent); /* Usará Rojo en Día y Azul en Noche */
      }

      [data-theme="light"] #notification-banner {
        border-bottom: 10px solid #1f6feb; /* Azul específico para el día */
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div id="notification-banner" class="notificacion-oculta">
      <div class="notif-content">
        <span id="notif-piloto">PILOTO</span>
        <span id="notif-info">¡NUEVA VUELTA!</span>

    <header>

      <main class="content-area">
        <section class="podium-container" id="podiumTop3"></section>
        <section class="card table-card">
          <div
            style="
              background: rgba(31, 111, 235, 0.1);
              border: 1px solid var(--accent);
              border-radius: 12px;
              padding: 25px;
              text-align: center;
              margin-bottom: 20px;
            "
          >
            <label
              style="
                color: var(--accent);
                font-weight: bold;
                letter-spacing: 2px;
              "
              >CRONÓMETRO EN VIVO</label
            >

            <p style="font-size: 1.2rem; color: #ffcc00; margin-bottom: 5px">
              En este momento corriendo:
              <span id="nombre-piloto" style="font-weight: bold"
                >Esperando...</span
              >
            </p>

            <div id="liveTime">00:00.00</div>
            <div
              id="recordMessage"
              style="
                color: #ffb700;
                font-size: 20px;
                font-weight: 800;
                text-transform: uppercase;
                margin-top: 10px;
                opacity: 0;
                transition: opacity 0.5s;
              "
            >
              ¡NUEVO RÉCORD DE PISTA! 🏆
            </div>
          </div>
          <div class="lbHeader">
            <div class="cell">#</div>
            <div class="cell">Piloto</div>
            <div class="cell center">Mejor Tiempo</div>
            <div class="cell center">Intentos</div>
            <div class="cell right">Tiempos</div>

    <div
      id="historyModal"
      class="modal-overlay"
      onclick="if (event.target === this) closeModal();"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">PILOTO</h2>
          <button
            class="btn-details"
            style="background: var(--danger)"
            onclick="closeModal()"
          >
            CERRAR
          </button>

        <div id="modalList" class="modal-list"></div>
      </div>

    <div
      id="loginModal"
      class="modal-overlay"
      onclick="if (event.target === this) closeLoginModal();"
    >
      <div class="modal-content" style="width: 400px">
        <div class="modal-header">
          <h2>ACCESO ADMIN</h2>
        </div>
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="tu@email.com" />
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
        <button class="primary" onclick="handleLogin()">INICIAR SESIÓN</button>
        <button
          class="ghost"
          style="width: 100%; margin-top: 10px"
          onclick="closeLoginModal()"
        >
          CANCELAR
        </button>
      </div>
    </div>

    <script>
      // 1. CONFIGURACIÓN SUPABASE
      const SUPABASE_URL = "https://knasnjakrhsxfanhfjha.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuYXNuamFrcmhzeGZhbmhmamhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1NzAxMzYsImV4cCI6MjA4NjE0NjEzNn0.XGwk7EOVOH_RktntWtuIPvijzv2G-VIbktt27XhJstQ";
      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      let state = { drivers: [], laps: {} };
      let isAdmin = false;
      // --- CANDADOS DE SEGURIDAD ---
      let ultimoTiempoSimulado = 0;
      let ultimaEjecucionReloj = 0;

      // --- CANDADOS DE SEGURIDAD PARA MÓVIL Y PC ---
      let lastSavedTimeMs = 0; // Guarda el tiempo de la vuelta (ej. 54432)
      let lastExecutionWallClock = 0; // Guarda la hora real (ej. 20:05:01)

      const podColors = ["#FFC107", "#C0C0C0", "#CD7F32"];
      const podLabels = ["🥇 1er lugar", "🥈 2do lugar", "🥉 3er lugar"];

      async function init() {
        await checkUser();
        await loadDataFromSupabase();
        renderAll();
      }

      // Validar y formatear la entrada de tiempo mientras el usuario escribe
      document.getElementById("lapTime").addEventListener("input", (e) => {
        // Eliminar todo lo que NO sea un número
        let v = e.target.value.replace(/\D/g, "");

        // Aplicar el formato MM:SS.mmm dinámicamente
        if (v.length > 4) {
          v = v.slice(0, 2) + ":" + v.slice(2, 4) + "." + v.slice(4, 7);
        } else if (v.length > 2) {
          v = v.slice(0, 2) + ":" + v.slice(2);
        }

        e.target.value = v;
      });

      async function checkUser() {
        const {
          data: { user },
        } = await _supabase.auth.getUser();

        // Si existe un usuario, isAdmin es true. Si es null, isAdmin es false.
        isAdmin = !!user;

        // Ejecutamos la actualización de la UI inmediatamente
        updateAdminUI();
      }

      async function loadDataFromSupabase() {
        const { data: drivers } = await _supabase.from("drivers").select("*");
        const { data: laps } = await _supabase
          .from("laps")
          .select("*")
          .order("created_at", { ascending: false });

        state.drivers = drivers || [];
        state.laps = {};
        state.drivers.forEach((d) => (state.laps[d.id] = []));

        if (laps) {
          laps.forEach((l) => {
            if (state.laps[l.driver_id]) {
              state.laps[l.driver_id].push({
                time: l.time_ms,
                ts: l.created_at,
              });
            }
          });
        }
      }

      // AUTH LOGIC
      function toggleAdminView() {
        if (!isAdmin) {
          document.getElementById("loginModal").style.display = "flex";
        } else {
          handleLogout();
        }
      }

      async function handleLogin() {
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;
        const { data, error } = await _supabase.auth.signInWithPassword({
          email,
          password,
        });
        if (error) {
          alert("Error: " + error.message);
        } else {
          isAdmin = true;
          closeLoginModal();
          updateAdminUI();
        }
      }

      async function handleLogout() {
        await _supabase.auth.signOut();
        isAdmin = false;
        updateAdminUI();
      }

      function updateAdminUI() {
        const adminElements = document.querySelectorAll(".admin-only");
        const btn = document.getElementById("adminToggleBtn");
        adminElements.forEach((el) =>
          isAdmin
            ? el.classList.remove("admin-hidden")
            : el.classList.add("admin-hidden"),
        );
        btn.innerText = isAdmin ? "🔒 Cerrar Sesión" : "🔑 Admin";
      }

      function closeLoginModal() {
        document.getElementById("loginModal").style.display = "none";
      }

      // DATA LOGIC
      async function addDriver() {
        const input = document.getElementById("pilotName");
        if (!input.value.trim()) return;
        const { data, error } = await _supabase
          .from("drivers")
          .insert([{ name: input.value.trim() }])
          .select();
        if (!error) {
          await loadDataFromSupabase();
          input.value = "";
          renderAll();
        }
      }

      async function saveLap() {
        const input = document.getElementById("lapTime");
        const id = document.getElementById("driverSelect").value;
        const timeValue = input.value;

        if (!id) {
          alert("⚠️ Selecciona un piloto primero.");
          return;
        }
        const parts = timeValue.match(/^(\d{2}):(\d{2})\.(\d{1,3})$/);
        if (!parts) {
          alert("⚠️ Formato MM:SS.mmm");
          return;
        }

        const ms =
          parseInt(parts[1]) * 60000 +
          parseInt(parts[2]) * 1000 +
          parseInt(parts[3].padEnd(3, "0"));

        // Guardar en Supabase
        const { data, error } = await _supabase
          .from("laps")
          .insert([{ driver_id: id, time_ms: ms }])
          .select();

        if (error) {
          console.error("Error al guardar:", error);
        } else {
          console.log("✅ Tiempo guardado");

          // --- ESTO CORRIGE EL DOBLE REGISTRO ---
          // Le avisamos al socket que este tiempo ya se procesó
          lastSavedTimeMs = ms;
          lastExecutionWallClock = Date.now();

          input.value = "";
          await loadDataFromSupabase();
          renderAll();

          // --- ESTO ACTIVA EL BRILLO ---
          ejecutarResaltado(id);
        }
      }

      function showRecordNotice() {
        const msg = document.getElementById("recordMessage");
        msg.style.opacity = "1";
        setTimeout(() => {
          msg.style.opacity = "0";
        }, 5000);
      }

      async function removeLastLap() {
        const id = document.getElementById("driverSelect").value;
        if (!id || !state.laps[id] || state.laps[id].length === 0) {
          alert("No hay tiempos para eliminar.");
          return;
        }

        if (confirm("¿Eliminar el último tiempo registrado de este piloto?")) {
          // Obtenemos el tiempo más reciente (el primero en el array ya que ordenamos por created_at desc)
          const lastLap = state.laps[id][0];

          const { error } = await _supabase
            .from("laps")
            .delete()
            .match({ driver_id: id, created_at: lastLap.ts });

          if (error) {
            alert("Error al eliminar: " + error.message);
          } else {
            await loadDataFromSupabase();
            renderAll();
          }
        }
      }

      // --- RENDERING FUNCTIONS ---
      function formatMs(ms) {
        const m = Math.floor(ms / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        const x = ms % 1000;
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(x).padStart(3, "0")}`;
      }

      function filterDrivers(val) {
        const list = document.getElementById("autocompleteList");
        if (!val) {
          list.style.display = "none";
          return;
        }
        const matches = state.drivers.filter((d) =>
          d.name.toLowerCase().includes(val.toLowerCase()),
        );
        if (matches.length > 0) {
          list.innerHTML = matches
            .map(
              (d) =>
                `<div class="autocomplete-item" onclick="selectPilot('${d.id}', '${d.name}')">${d.name}</div>`,
            )
            .join("");
          list.style.display = "block";
        } else {
          list.style.display = "none";
        }
      }

      // Buscar un piloto solo cambia el historial local. No cambia el piloto en pista.
      function selectPilot(id, name) {
        document.getElementById("driverSelect").value = id;
        document.getElementById("pilotSearch").value = name;
        document.getElementById("autocompleteList").style.display = "none";
        renderMiniHistory();
      }

      // Solo un administrador puede solicitar al bridge cambiar el piloto activo.
      async function setActiveDriver() {
        if (!isAdmin) return;
        const id = document.getElementById("driverSelect").value;
        const name = document.getElementById("pilotSearch").value;
        if (!id || !state.drivers.some(d => d.id === id && d.name === name)) {
          alert("Primero selecciona un piloto de la lista.");
          return;
        }
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          alert("El puente de telemetría no está conectado.");
          return;
        }
        await sendAuthorizedDriverSelection(id, name);
      }

      function renderAll() {
        const allDrivers = state.drivers
          .map((d) => {
            const times = state.laps[d.id]
              ? state.laps[d.id].map((l) => l.time)
              : [];
            return {
              ...d,
              best: times.length ? Math.min(...times) : null,
              count: times.length,
            };
          })
          .sort((a, b) =>
            a.best === null ? 1 : b.best === null ? -1 : a.best - b.best,
          );

        const podiumDrivers = allDrivers.filter((d) => d.best !== null);
        document.getElementById("podiumTop3").innerHTML = [1, 2, 3]
          .map((pos, i) => {
            const d = podiumDrivers[pos - 1];
            return `<div class="podiumCard" style="--card-color: ${podColors[i]}">
                <div class="podium-inner">
                    <div class="puesto-badge">${podLabels[i]}</div>
                    <div class="podium-stage">
                        <div class="podium-emblem" aria-hidden="true">${i === 0 ? `<svg viewBox="0 0 180 140" aria-hidden="true" focusable="false"><defs><linearGradient id="orion-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a1"/><stop offset=".35" stop-color="#f9c844"/><stop offset=".7" stop-color="#c88b11"/><stop offset="1" stop-color="#ffe179"/></linearGradient></defs><g fill="none" stroke="#d4a43b" stroke-width="3" opacity=".68"><path d="M35 95Q15 75 24 48M145 95Q165 75 156 48"/><path d="M29 88l-13-2M24 74l-12-7M23 60l-8-10M151 88l13-2M156 74l12-7M157 60l8-10"/></g><path d="M59 29H121V64Q121 96 90 103Q59 96 59 64Z" fill="url(#orion-gold)" stroke="#ffe7a3" stroke-width="2"/><path d="M59 37H43Q33 37 34 51Q35 68 60 73M121 37H137Q147 37 146 51Q145 68 120 73" fill="none" stroke="#e3b84e" stroke-width="9"/><path d="M90 103V117M70 118H110V127H70Z" stroke="#e9ba50" stroke-width="8" stroke-linejoin="round"/><path d="M75 128H105" stroke="#fff0aa" stroke-width="3"/><path d="M71 38Q68 76 86 88" fill="none" stroke="#fff3ae" stroke-width="6" opacity=".45"/></svg>` : `<svg viewBox="0 0 150 140" aria-hidden="true" focusable="false"><defs><linearGradient id="orion-medal-${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${i === 1 ? '#f6f8fb' : '#ffd49c'}"/><stop offset=".55" stop-color="${i === 1 ? '#aeb8c6' : '#c47a39'}"/><stop offset="1" stop-color="${i === 1 ? '#657386' : '#81441e'}"/></linearGradient></defs><path d="M53 13H73L84 54H64Z" fill="#2766bc"/><path d="M77 13H98L85 54H65Z" fill="#4d95f3"/><circle cx="75" cy="86" r="39" fill="url(#orion-medal-${i})" stroke="${i === 1 ? '#d9e1ea' : '#f0b478'}" stroke-width="5"/><circle cx="75" cy="86" r="30" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="2"/><text x="75" y="100" text-anchor="middle" font-size="40" font-weight="900" fill="${i === 1 ? '#3a4656' : '#5d321a'}" font-family="Rubik,Arial,sans-serif">${i+1}</text></svg>`}</div>
                        <div class="pilot-info">
                            <div class="pilot-name-big">${d ? d.name : "VACANTE"}</div>
                            <div class="time-pill"><strong>${d ? formatMs(d.best) : "--:--.---"}</strong></div>
                        </div>
                    </div>
                    <div class="podium-footer">${i === 0 ? "LÍDER DE PISTA" : i === 1 ? "SUBCAMPEÓN" : "TERCER PUESTO"}</div>
                </div>
            </div>`;
          })
          .join("");

        // El podio ya muestra los tres mejores pilotos con tiempo valido.
        // En la tabla solo aparecen los demas, conservando su puesto real.
        const podiumIds = new Set(podiumDrivers.slice(0, 3).map(d => d.id));
        const remainingDrivers = allDrivers
          .map((d, i) => ({ ...d, rank: i + 1 }))
          .filter(d => !podiumIds.has(d.id));
        document.getElementById("fullLeaderboard").innerHTML = remainingDrivers
          .map(
            (d) => `
            <div class="lbRow" data-driver-id="${d.id}"> 
                <div class="cell">#${d.rank}</div>
                <div class="cell" style="font-weight:bold;">${d.name}</div>
                <div class="cell center">${d.best ? formatMs(d.best) : "—"}</div>
                <div class="cell center">${d.count}</div>
                <div class="cell right">
                    <button class="btn-details" onclick="showDetails('${d.id}')">DETALLES</button>
                </div>
            </div>`,
          )
          .join("");

        renderMiniHistory();
      }

      function showDetails(id) {
        const d = state.drivers.find((x) => x.id === id);
        document.getElementById("modalTitle").innerText = d.name;

        const times = [...state.laps[id]];
        // Encontramos cuál es el tiempo más bajo (el récord personal)
        const bestTime =
          times.length > 0 ? Math.min(...times.map((l) => l.time)) : null;

        document.getElementById("modalList").innerHTML = times
          .map((l, i) => {
            const isBest = l.time === bestTime;
            return `
      <div class="modal-item" style="${isBest ? "border-color: var(--accent); background: rgba(31, 111, 235, 0.05);" : ""}">
        <span>Vuelta ${times.length - i} ${isBest ? "🏆" : ""}</span>
        <strong style="${isBest ? "color: var(--accent);" : ""}">${formatMs(l.time)}</strong>
      </div>`;
          })
          .join("");

        document.getElementById("historyModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("historyModal").style.display = "none";
      }

      function renderMiniHistory() {
        const id = document.getElementById("driverSelect").value;
        const list = document.getElementById("miniHistoryList");
        if (!id) {
          list.innerHTML = "Sin datos";
          return;
        }
        const laps = state.laps[id];

        // Dentro de la función renderMiniHistory, antes del list.innerHTML:
        const totalVueltas = laps.length;
        document.getElementById("driverStatus").innerHTML = `<small style="color:var(--accent)">Total: ${totalVueltas} vueltas</small>`;

        list.innerHTML = laps
          .slice(0, 10)
          .map(
            (l) => `
      <div class="hist-item">
        <span>${new Date(l.ts).toLocaleTimeString()}</span>
        <strong>${formatMs(l.time)}</strong>
      </div>`,
          )
          .join("");
      }

      function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById("themeBtn");
        if (html.getAttribute("data-theme") === "light") {
          html.removeAttribute("data-theme");
          btn.innerText = "☀️ DÍA";
        } else {
          html.setAttribute("data-theme", "light");
          btn.innerText = "🌙 NOCHE";
        }
      }

      async function resetAll() {
        if (!isAdmin) return;
        if (
          confirm(
            "¿ESTÁS SEGURO? Esto borrará TODOS los tiempos de la base de datos.",
          )
        ) {
          const { error } = await _supabase
            .from("laps")
            .delete()
            .neq("time_ms", 0);
          if (!error) {
            await loadDataFromSupabase();
            renderAll();
          }
        }
      }

      // --- UTILS ---
      async function sendAuthorizedDriverSelection(id, name) {
        if (!isAdmin || !socket || socket.readyState !== WebSocket.OPEN || !id) return;
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session?.access_token) {
          console.warn("Sesion no disponible para seleccionar piloto");
          return;
        }
        socket.send(JSON.stringify({
          type: "SELECT_DRIVER",
          driver_id: id,
          driver_name: name,
          access_token: session.access_token,
        }));
      }

      const socket = new WebSocket(
        "wss://cleotilde-stroboscopic-jaunita.ngrok-free.dev",
      );
      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "ERROR") {
          console.warn("Orión Bridge:", data.message);
          return;
        }

        // 1. LÓGICA PARA EL TIEMPO EN VIVO
        if (data.type === "LIVE") {
          const ms = data.current_ms;
          const m = Math.floor(ms / 60000);
          const s = Math.floor((ms % 60000) / 1000);
          const x = Math.floor((ms % 1000) / 10);

          document.getElementById("liveTime").innerText =
            `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(x).padStart(2, "0")}`;

          if (data.driver_name) {
            document.getElementById("nombre-piloto").innerText =
              data.driver_name;
          }
        }

        if (data.type === "NEW_LAP") {
          const tiempoSimMs = Math.floor(data.time_ms);
          const ahoraReal = Date.now();

          if (
            tiempoSimMs === lastSavedTimeMs ||
            ahoraReal - lastExecutionWallClock < 4000
          )
            return;

          lastSavedTimeMs = tiempoSimMs;
          lastExecutionWallClock = ahoraReal;

          const tiempoFinalTexto = formatMs(tiempoSimMs);
          const nombrePiloto = data.driver_name;

          // --- CALCULAR POSICIÓN REAL ---
          // Esperamos un momento a que la base de datos se actualice y recalculamos
          setTimeout(async () => {
            await loadDataFromSupabase();
            renderAll(); // Esto ya ordena a los pilotos por tiempo

            // Buscamos en qué índice de la tabla quedó el piloto
            const allDriversSorted = state.drivers
              .map((d) => ({
                id: d.id,
                best:
                  state.laps[d.id] && state.laps[d.id].length
                    ? Math.min(...state.laps[d.id].map((l) => l.time))
                    : Infinity,
              }))
              .sort((a, b) => a.best - b.best);

            const puestoReal =
              allDriversSorted.findIndex(
                (d) =>
                  d.id ===
                  state.drivers.find((p) => p.name === nombrePiloto)?.id,
              ) + 1;

            // --- MOSTRAR BANNER CON DATOS REALES ---
            const banner = document.getElementById("notification-banner");
            document.getElementById("notif-piloto").innerText =
              nombrePiloto || "Piloto";
            document.getElementById("notif-tiempo").innerText =
              tiempoFinalTexto;
            document.getElementById("notif-puesto").innerText =
              `PUESTO #${puestoReal || "?"}`;

            banner.classList.add("mostrar");
            setTimeout(() => banner.classList.remove("mostrar"), 5000);

            // --- DISPARAR BRILLO ---
            const pilotoObj = state.drivers.find(
              (d) => d.name === nombrePiloto,
            );
            if (pilotoObj) ejecutarResaltado(pilotoObj.id);
          }, 1200); // Retraso de 1.2s para sincronizar con la nube
        }
      };

     function ejecutarResaltado(driverId) {
    setTimeout(() => {
        const fila = document.querySelector(`.lbRow[data-driver-id="${driverId}"]`);
        if (fila) {
            // Scroll suave
            fila.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Limpieza y Reflow (esto fuerza el parpadeo amarillo)
            fila.classList.remove("row-highlighted");
            void fila.offsetWidth; 
            fila.classList.add("row-highlighted");
            
            setTimeout(() => fila.classList.remove("row-highlighted"), 5000);
        }
    }, 500);
}

      init();
    </script>
  </body>
</html>
